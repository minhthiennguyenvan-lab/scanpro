<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>Scan Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet, confident pocket tool — like a well-made office scanner app.
   IDEA: the scanned sheet itself — white paper, crisp edges, a blue capture frame.
   PICTURE: the document list and the live crop frame are the picture; nothing decorative.
   COLOUR and TYPE: white field, scanner blue #1769ff, ink #14181f, pastel action discs; Be Vietnam Pro.
   LAYOUT: phone-first single column, bottom nav + floating capture pill, full-screen tools. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1217);--bg2:light-dark(#f2f4f8,#171b22);--card:light-dark(#ffffff,#1a1f27);
--ink:light-dark(#14181f,#eef1f6);--mut:light-dark(#6b7486,#97a0b2);--line:light-dark(#e6e9ef,#262c36);
--blue:#1769ff;--blue2:light-dark(#e8f0ff,#16264a);--red:#e5484d;
--t1:light-dark(#e8f0ff,#16264a);--t2:light-dark(#e2f6f2,#123a33);--t3:light-dark(#ffecea,#3d1d1c);--t4:light-dark(#f0ecff,#2a2347)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view[hidden]{display:none}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--bg2)}
/* home */
.top{display:flex;align-items:center;gap:4px;padding:14px 12px 6px 20px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.02em;flex:1;line-height:1.1}
.logo span{color:var(--blue)}
.srch{margin:4px 16px 8px;display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:14px;padding:0 12px}
.srch input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);height:44px;outline:none}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:14px 10px 18px;border-bottom:8px solid var(--bg2)}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500;text-align:center;line-height:1.25}
.qa i{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.qa i svg{width:30px;height:30px;stroke-width:2.1}
.inst{display:flex;align-items:center;gap:10px;margin:14px 16px 0;padding:10px 10px 10px 14px;border-radius:16px;background:var(--blue2);color:var(--blue);font-weight:600;font-size:15px}.inst span{flex:1}.inst .btn{height:40px}
.lh{display:flex;align-items:center;padding:14px 10px 4px 20px}
.lh h2{flex:1;margin:0;font-size:21px;font-weight:700}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#list{list-style:none;margin:0;padding:0 0 150px}
.doc{display:flex;gap:16px;padding:12px 16px 12px 20px;align-items:center;cursor:pointer}
.doc:active{background:var(--bg2)}
.th{position:relative;width:96px;height:76px;border-radius:10px;border:1px solid var(--line);background:#fff;overflow:hidden;flex:none;box-shadow:0 1px 3px #0001}
.th img{width:100%;height:100%;object-fit:cover;object-position:top}
.th b{position:absolute;right:0;bottom:0;background:#3c4350d9;color:#fff;font-size:13px;min-width:28px;text-align:center;padding:2px 6px;border-top-left-radius:8px}
.meta{flex:1;border-bottom:1px solid var(--line);padding-bottom:10px}
.nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;margin-top:4px}
.dt{color:var(--mut);font-size:14px;flex:1}
.acts{display:flex;color:var(--mut)}
.acts button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);flex:none;display:grid;place-items:center}
.ck.on{background:var(--blue);border-color:var(--blue)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{text-align:center;color:var(--mut);padding:40px 30px}
.empty svg{width:150px;height:auto;display:block;margin:0 auto 14px}
.fab{position:absolute;right:18px;bottom:88px;display:flex;background:var(--blue);border-radius:40px;box-shadow:0 8px 24px #1769ff55;color:#fff;z-index:5}
.fab button{width:72px;height:60px;display:grid;place-items:center}
.fab button+button{border-left:1px solid #ffffff40}
.fab svg{width:30px;height:30px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:14px;font-weight:600;color:var(--mut)}
.nav button.on{color:var(--blue)}
.selbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:6}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff}.btn.dan{color:var(--red)}
.btn[disabled]{opacity:.4}
.selbar .btn{flex:1}
/* tools */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:8px 16px 120px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;font-weight:500;text-align:center;line-height:1.25}
.tool i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tsec{padding:18px 20px 6px;font-weight:700;font-size:18px}
/* bars */
.bar{display:flex;align-items:center;gap:4px;padding:8px 8px;min-height:60px;border-bottom:1px solid var(--line)}
.bar .ttl{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pill{height:40px;padding:0 16px;border-radius:20px;background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px}
/* camera */
#cam{background:#000;color:#fff}
#cam .bar{border:0;background:#000}
.camwrap{flex:1;position:relative;overflow:hidden}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;font-size:14px;white-space:nowrap}
.camctl{display:flex;align-items:center;justify-content:space-around;padding:18px 10px calc(22px + env(safe-area-inset-bottom))}
.shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shut::after{content:"";width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .12s}
.shut:active::after{transform:scale(.88)}
.shut.auto::after{background:var(--blue)}
.mini{width:56px;height:56px;border-radius:10px;border:2px solid #fff6;overflow:hidden;position:relative;display:grid;place-items:center}
.mini img{width:100%;height:100%;object-fit:cover}
.mini b{position:absolute;top:-1px;right:-1px;background:var(--blue);font-size:12px;border-radius:0 0 0 8px;padding:1px 6px}
.modes{display:flex;justify-content:center;gap:6px;padding-top:12px}
.modes button{padding:6px 14px;border-radius:16px;font-size:14px;color:#fffa}
.modes button.on{background:#fff2;color:#fff;font-weight:600}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
/* crop */
#crop{background:#1b1f26;color:#fff}
#crop .bar{border:0}
.cropwrap{flex:1;position:relative;touch-action:none;overflow:hidden}
.cropwrap canvas,.cropwrap svg{position:absolute}
#loupe{position:absolute;width:118px;height:118px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px #0008;pointer-events:none;display:none;top:12px;left:12px}
.cbtns{display:flex;justify-content:space-around;padding:10px 6px calc(14px + env(safe-area-inset-bottom))}
.cbtns button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;min-width:72px;padding:6px}
.cbtns .ok{color:#fff}.cbtns .ok i{background:var(--blue);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-top:-6px}
/* editor */
#edit{background:var(--bg2)}
#edit .bar{background:var(--bg)}
.pager{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}
.pg img{display:block;flex:none;object-fit:contain;max-width:100%;max-height:100%;box-shadow:0 4px 20px #0002;background:#fff}
.pgind{text-align:center;font-size:14px;color:var(--mut);padding:4px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px}
.pgind button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.etools{display:flex;overflow-x:auto;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}
.etools button{flex:1 0 68px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:500;padding:6px 2px;border-radius:12px}
.etools button.on{color:var(--blue)}
.fpanel{background:var(--bg);border-top:1px solid var(--line);padding:10px 0 4px}
.fpanel[hidden]{display:none}
.frow{display:flex;gap:10px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.fi{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px}
.fi canvas,.fi img{width:70px;height:88px;object-fit:cover;border-radius:8px;border:2px solid transparent;background:#fff}
.fi.on canvas,.fi.on img{border-color:var(--blue)}
.fi.on{color:var(--blue);font-weight:600}
.sl{display:flex;align-items:center;gap:10px;padding:2px 16px;font-size:13px;color:var(--mut)}
.sl input{flex:1;accent-color:var(--blue);height:32px}
.sl output{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.fpanel .lnk{color:var(--blue);font-weight:600;font-size:14px;padding:8px 16px}
.sig{position:absolute;border:2px dashed var(--blue);touch-action:none;cursor:move}
.sig img{width:100%;height:100%;display:block;pointer-events:none}
.sig i{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:var(--blue);border:3px solid #fff}
.placebar{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.placebar .btn{flex:1}
/* sheet & dialog */
.back{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .18s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 12px;font-size:19px}
.dlg{align-items:center;padding:24px}
.dlg .sheet{border-radius:22px;padding:22px 20px 16px;animation:pop .18s}
.dlg .sheet::before{display:none}
.dlg p{margin:0 0 16px;color:var(--mut)}
.dbtn{display:flex;gap:8px;justify-content:flex-end}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;font-size:16px;border-radius:12px;text-align:left}
.mi:active{background:var(--bg2)}
.mi.dan{color:var(--red)}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:13.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.inp:focus{border-color:var(--blue);outline:none}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--blue);font-weight:700;box-shadow:0 1px 3px #0002}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.tg small{display:block;color:var(--mut);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s}
.sw.on{background:var(--blue)}.sw.on::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
#pad{width:100%;height:200px;border:1.5px dashed var(--line);border-radius:14px;background:#fff;touch-action:none;display:block}
.colors{display:flex;gap:10px;margin:10px 0}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--blue)}
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.og{background:var(--bg2);border-radius:12px;padding:6px;text-align:center;font-size:13px}
.og img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:6px;display:block}
.og div{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.og button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.og svg{width:20px;height:20px}
.pick{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.pick img{width:44px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
/* busy & toast */
.busy{position:fixed;inset:0;z-index:80;background:#0008;display:grid;place-items:center;color:#fff}
.busy div{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:500}
.busy i{width:44px;height:44px;border:4px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#20252ef2;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:90;max-width:88vw;text-align:center;animation:fd .2s}
@keyframes sp{to{transform:rotate(1turn)}}@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(40%)}}@keyframes pop{from{transform:scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></symbol>
<symbol id="i-rot" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></symbol>
<symbol id="i-wand" viewBox="0 0 24 24"><path d="M4 20 15 9M13.5 7.5l3 3M6 4v3M4.5 5.5h3M18 14v3M16.5 15.5h3M19 4l.01 0"/></symbol>

<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-ord" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/><path d="M16 4h4v4M8 20H4v-4"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol>

<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const frame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,16)));
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const FULL=[[0,0],[1,0],[1,1],[0,1]];
const FILTERS=[['orig','Gốc'],['auto','Tự động'],['magic','Không bóng'],['enhance','Tăng cường'],['gray','Xám'],['bw','Đen trắng'],['ink','Tiết kiệm mực']];
const QUAL={high:[2200,.88],med:[1600,.76],low:[1150,.6]};

/* ---------- settings ---------- */
const DEF={filter:'auto',autoCrop:true,autoShot:true,size:'A4',quality:'high',prefix:'Scan',sort:'new',batch:false};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('scanpro-set')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('scanpro-set',JSON.stringify(S))}catch(e){}};
if(!S.v2){S.filter='auto';S.v2=1;saveS()}

/* ---------- storage (IndexedDB, memory fallback) ---------- */
const DB={db:null,mem:{docs:new Map(),pages:new Map()},
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('scanpro',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs',{keyPath:'id'});d.createObjectStore('pages',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
 tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 async put(st,v){this.mem[st].set(v.id,v);if(this.db)try{await this.tx(st,'readwrite',s=>s.put(v))}catch(e){}},
 async get(st,id){if(this.mem[st].has(id))return this.mem[st].get(id);if(this.db)try{return await this.tx(st,'readonly',s=>s.get(id))}catch(e){}},
 async del(st,id){this.mem[st].delete(id);if(this.db)try{await this.tx(st,'readwrite',s=>s.delete(id))}catch(e){}},
 async all(st){if(this.db)try{return await this.tx(st,'readonly',s=>s.getAll())}catch(e){}return[...this.mem[st].values()]}
};

/* ---------- canvas helpers ---------- */
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const ctx=c=>c.getContext('2d',{willReadFrequently:true});
const toBlob=(c,q=.9)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q));
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Không đọc được ảnh'));i.src=src})}
async function blobImg(b){const u=URL.createObjectURL(b);try{return await loadImg(u)}finally{setTimeout(()=>URL.revokeObjectURL(u),3000)}}
function scaleTo(src,max){const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h)),c=cv(Math.round(w*s),Math.round(h*s));const x=ctx(c);x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);return c}
function rotC(c,deg){if(!deg)return c;const r=deg%180!==0,o=cv(r?c.height:c.width,r?c.width:c.height),x=ctx(o);x.translate(o.width/2,o.height/2);x.rotate(deg*Math.PI/180);x.drawImage(c,-c.width/2,-c.height/2);return o}
const thumbOf=(c,m=260)=>scaleTo(c,m).toDataURL('image/jpeg',.72);
async function normalizeInput(file){const img=await blobImg(file),w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,2600/Math.max(w,h)),c=cv(Math.round(w*s),Math.round(h*s)),x=ctx(c);x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);return{blob:await toBlob(c,.92),canvas:c}}

/* ---------- document edge detection ---------- */
function boxBlur(a,W,H,r){const t=new Float32Array(a.length),o=new Float32Array(a.length),n=2*r+1;
 for(let y=0;y<H;y++){let s=0;const b=y*W;for(let x=-r;x<=r;x++)s+=a[b+Math.min(W-1,Math.max(0,x))];for(let x=0;x<W;x++){t[b+x]=s/n;s+=a[b+Math.min(W-1,x+r+1)]-a[b+Math.max(0,x-r)]}}
 for(let x=0;x<W;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[Math.min(H-1,Math.max(0,y))*W+x];for(let y=0;y<H;y++){o[y*W+x]=s/n;s+=t[Math.min(H-1,y+r+1)*W+x]-t[Math.max(0,y-r)*W+x]}}return o}
function morph(m,W,H,dil,r){const t=new Uint8Array(m.length),o=new Uint8Array(m.length);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=dil?0:1;for(let k=-r;k<=r;k++){const xx=x+k;const p=xx<0||xx>=W?(dil?0:1):m[y*W+xx];if(dil?p:!p){v=dil?1:0;break}}t[y*W+x]=v}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=dil?0:1;for(let k=-r;k<=r;k++){const yy=y+k;const p=yy<0||yy>=H?(dil?0:1):t[yy*W+x];if(dil?p:!p){v=dil?1:0;break}}o[y*W+x]=v}return o}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const L=[],U=[];
 for(const p of P){while(L.length>1&&cr(L[L.length-2],L[L.length-1],p)<=0)L.pop();L.push(p)}
 for(let i=P.length-1;i>=0;i--){const p=P[i];while(U.length>1&&cr(U[U.length-2],U[U.length-1],p)<=0)U.pop();U.push(p)}U.pop();L.pop();return L.concat(U)}
const polyArea=q=>{let a=0;for(let i=0;i<q.length;i++){const p=q[i],n=q[(i+1)%q.length];a+=p[0]*n[1]-n[0]*p[1]}return a/2};
function orderQuad(q){const cx=q.reduce((s,p)=>s+p[0],0)/4,cy=q.reduce((s,p)=>s+p[1],0)/4;q=q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));let k=0,m=1e9;q.forEach((p,i)=>{if(p[0]+p[1]<m){m=p[0]+p[1];k=i}});return q.slice(k).concat(q.slice(0,k))}
function isConvex(q){let s=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4],z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(z===0)return false;if(!s)s=Math.sign(z);else if(Math.sign(z)!==s)return false}return true}
function detectQuad(src,w,h,SZ=360){
 const sc=SZ/Math.max(w,h),W=Math.max(16,Math.round(w*sc)),H=Math.max(16,Math.round(h*sc)),N=W*H;
 const c=cv(W,H),x=ctx(c);x.drawImage(src,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
 let g=new Float32Array(N);for(let i=0;i<N;i++){const r=d[i*4],G=d[i*4+1],b=d[i*4+2];g[i]=r*.3+G*.59+b*.11-(Math.max(r,G,b)-Math.min(r,G,b))*.6}
 g=boxBlur(boxBlur(g,W,H,2),W,H,1);
 let lo=1e9,hi=-1e9;for(const v of g){if(v<lo)lo=v;if(v>hi)hi=v}if(hi-lo<24)return null;
 const hist=new Float64Array(256);for(const v of g)hist[Math.min(255,((v-lo)/(hi-lo)*255)|0)]++;
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,best=0,th=128;
 for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hist[i];const v=wB*wF*(sB/wB-(sum-sB)/wF)**2;if(v>best){best=v;th=i}}
 const t=lo+(th+.5)/255*(hi-lo);let m=new Uint8Array(N);for(let i=0;i<N;i++)m[i]=g[i]>t?1:0;
 m=morph(morph(m,W,H,0,2),W,H,1,2);m=morph(morph(m,W,H,1,2),W,H,0,2);
 const lab=new Int32Array(N).fill(-1),st=new Int32Array(N);let bc=-1,ba=0;
 for(let i=0;i<N;i++){if(!m[i]||lab[i]>=0)continue;let sp=0,a=0;st[sp++]=i;lab[i]=i;
  while(sp){const p=st[--sp];a++;const px=p%W;
   if(px>0&&m[p-1]&&lab[p-1]<0){lab[p-1]=i;st[sp++]=p-1}if(px<W-1&&m[p+1]&&lab[p+1]<0){lab[p+1]=i;st[sp++]=p+1}
   if(p>=W&&m[p-W]&&lab[p-W]<0){lab[p-W]=i;st[sp++]=p-W}if(p+W<N&&m[p+W]&&lab[p+W]<0){lab[p+W]=i;st[sp++]=p+W}}
  if(a>ba){ba=a;bc=i}}
 if(ba<N*.08)return null;
 const pts=[];for(let y=0;y<H;y++){let l=-1,r=-1;for(let xx=0;xx<W;xx++)if(lab[y*W+xx]===bc){if(l<0)l=xx;r=xx}if(l>=0){pts.push([l,y],[r+1,y],[l,y+1],[r+1,y+1])}}
 const hl=hull(pts);if(hl.length<4)return null;
 let A=hl[0],B=hl[1],dm=0;for(let i=0;i<hl.length;i++)for(let j=i+1;j<hl.length;j++){const dd=(hl[i][0]-hl[j][0])**2+(hl[i][1]-hl[j][1])**2;if(dd>dm){dm=dd;A=hl[i];B=hl[j]}}
 let p1=null,p2=null,m1=0,m2=0;for(const p of hl){const z=(B[0]-A[0])*(p[1]-A[1])-(B[1]-A[1])*(p[0]-A[0]);if(z>m1){m1=z;p1=p}if(z<m2){m2=z;p2=p}}
 if(!p1||!p2)return null;let q=[A,p1,B,p2];

function closeCam(){clearTimeout(camT);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;lastQ=null;stable=0}
function camLoop(){const v=$('#vid'),o=$('#ov');if(!stream)return;const W=o.clientWidth,H=o.clientHeight;if(o.width!==W||o.height!==H){o.width=W;o.height=H}
 const x=o.getContext('2d');x.clearRect(0,0,W,H);

  if(q&&lastQ){const mv=Math.max(...q.map((p,i)=>Math.hypot(p[0]-lastQ[i][0],p[1]-lastQ[i][1])));stable=mv<.02?stable+1:0;q=q.map((p,i)=>[lastQ[i][0]*.4+p[0]*.6,lastQ[i][1]*.4+p[1]*.6])}else stable=0;
  lastQ=q;camQ=q;
  if(q){const s=Math.min(W/v.videoWidth,H/v.videoHeight),ox=(W-v.videoWidth*s)/2,oy=(H-v.videoHeight*s)/2;x.beginPath();q.forEach((p,i)=>x[i?'lineTo':'moveTo'](ox+p[0]*v.videoWidth*s,oy+p[1]*v.videoHeight*s));x.closePath();x.fillStyle='rgba(23,105,255,.22)';x.fill();x.lineWidth=3;x.strokeStyle='#1769ff';x.stroke()}
  $('#cHint').textContent=!q?'Đưa tài liệu vào khung hình':S.autoShot?(stable>=2?'Giữ yên… đang tự chụp':'Đã thấy tài liệu – giữ máy ổn định'):'Đã thấy tài liệu – nhấn nút chụp';
  if(q&&S.autoShot&&stable>=5&&Date.now()-lastShot>2200){shutter();return}}

async function openCrop(p,cb){cr.p=p;cr.cb=cb;cr.q=p.quad.map(a=>a.slice());cr.img=await origCanvas(p);$('#crTitle').textContent=cap.target==='id'?(idShots.length?'Mặt sau – căn 4 góc thẻ':'Mặt trước – căn 4 góc thẻ'):'Kéo các góc để căn chỉnh';show('crop');await frame();layoutCrop()}

function drawCrop(){const P=cr.q.map(([x,y])=>[cr.ox+x*cr.dw,cr.oy+y*cr.dh]),ok=isConvex(cr.q),col=ok?'#1769ff':'#e5484d';

  mids.map(m=>`<rect x="${m[0]-11}" y="${m[1]-5}" width="22" height="10" rx="5" fill="#fff" stroke="${col}" stroke-width="2"/>`).join('')+P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="13" fill="rgba(255,255,255,.25)" stroke="${col}" stroke-width="3"/><circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"/>`).join('')}
function loupe(nx,ny,px,py){const L=$('#loupe'),x=L.getContext('2d'),z=3,r=L.width/2/z*(cr.img.width/cr.dw)/ (devicePixelRatio>1?1:1);L.style.display='block';L.style.left=(px<cr.ox+cr.dw/2&&py<200?$('#cropwrap').clientWidth-130:12)+'px';

const cw=$('#cropwrap');

 if(a!=='filter')closePanels();
 if(a==='add'){const s=openSheet(`<h3>Thêm trang</h3><button class="mi" data-v="cam">${ic('cam')}Chụp ảnh mới</button><button class="mi" data-v="gal">${ic('img')}Chọn từ thư viện ảnh</button>`);s.onclick=ev=>{const v=ev.target.closest('[data-v]');if(!v)return;closeSheet();v.dataset.v==='cam'?startScan('add',false):startImport('add')}}
 else if(a==='crop'){cap={target:'recrop',batch:false};openCrop(p,async pp=>{await busy('Đang xử lý…');await processPage(pp);busy();show('edit');refreshCur()})}
 else if(a==='rot'){p.rot=((p.rot||0)+90)%360;await busy('Đang xoay…');await processPage(p);busy();refreshCur()}
 else if(a==='filter'){if(!$('#fpanel').hidden){closePanels();return}b.classList.add('on');openFilter()}
 else if(a==='sign')signSheet();
 else if(a==='ord')orderSheet();
 else if(a==='del'){if(await confirmBox('Xóa trang?',cur.pages.length>1?`Xóa trang ${idx+1} khỏi tài liệu?`:'Đây là trang duy nhất – tài liệu sẽ bị xóa.')){if(cur.pages.length===1){await deleteDoc(cur.doc);cur=null;show('home');renderList();return}await DB.del('pages',p.id);cur.pages.splice(idx,1);await saveDoc(cur.doc,cur.pages);renderEditor(Math.min(idx,cur.pages.length-1))}}};

let fBase=null,fFor=null;
async function openFilter(){const p=cur.pages[idx];$('#fpanel').hidden=false;$('#sBr').value=p.br||0;$('#sCt').value=p.ct||0;$('#oBr').textContent=p.br||0;$('#oCt').textContent=p.ct||0;
 $('#frow').innerHTML=FILTERS.map(([k,t])=>`<button class="fi ${p.filter===k?'on':''}" data-f="${k}"><canvas width="140" height="176"></canvas>${t}</button>`).join('');
 if(fFor!==p.id+p.rot+JSON.stringify(p.quad)){fBase=await renderPage({...p,ov:[]},300,false);fFor=p.id+p.rot+JSON.stringify(p.quad)}
 $$('#frow .fi').forEach(el=>{const c=el.querySelector('canvas'),t=cv(fBase.width,fBase.height);ctx(t).drawImage(fBase,0,0);applyFilter(t,el.dataset.f);const x=c.getContext('2d'),s=Math.max(c.width/t.width,c.height/t.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(t,(c.width-t.width*s)/2,0,t.width*s,t.height*s)})}
$('#frow').onclick=async e=>{const b=e.target.closest('[data-f]');if(!b)return;const p=cur.pages[idx];p.filter=b.dataset.f;$$('#frow .fi').forEach(x=>x.classList.toggle('on',x===b));await busy('Đang áp dụng bộ lọc…');await processPage(p);busy();refreshCur()};
['sBr','sCt'].forEach(id=>{const el=$('#'+id);el.oninput=()=>{$('#o'+id.slice(1)).textContent=el.value};el.onchange=async()=>{const p=cur.pages[idx];p.br=+$('#sBr').value;p.ct=+$('#sCt').value;await busy('Đang chỉnh…');await processPage(p);busy();refreshCur()}});
$('#fAll').onclick=async()=>{const p=cur.pages[idx];for(let i=0;i<cur.pages.length;i++){const q=cur.pages[i];if(q===p)continue;await busy(`Đang áp dụng ${i+1}/${cur.pages.length}…`);Object.assign(q,{filter:p.filter,br:p.br,ct:p.ct});await processPage(q)}busy();await saveDoc(cur.doc,cur.pages);renderEditor(idx);toast('Đã áp dụng cho tất cả trang')};

function orderSheet(){const draw=()=>{s.querySelector('.ogrid').innerHTML=cur.pages.map((p,i)=>`<div class="og"><img src="${p.thumb}" alt=""><div><button data-o="l" data-i="${i}" aria-label="Lên trước"${i?'':' disabled style="opacity:.3"'}>${ic('back')}</button><b>${i+1}</b><button data-o="r" data-i="${i}" aria-label="Ra sau"${i<cur.pages.length-1?'':' disabled style="opacity:.3"'}>${ic('next')}</button></div></div>`).join('')};
 const s=openSheet(`<h3>Sắp xếp trang</h3><div class="ogrid"></div><button class="btn pri" style="width:100%;margin-top:14px" id="oOk">Xong</button>`);draw();
 s.onclick=async e=>{const b=e.target.closest('[data-o]');if(b){const i=+b.dataset.i,j=b.dataset.o==='l'?i-1:i+1;[cur.pages[i],cur.pages[j]]=[cur.pages[j],cur.pages[i]];draw();return}if(e.target.id==='oOk'){closeSheet();await saveDoc(cur.doc,cur.pages);renderEditor(0)}}}

/* signature */
let place=null;
function signSheet(){let saved='';try{saved=localStorage.getItem('scanpro-sig')||''}catch(e){}
 const s=openSheet(`<h3>Ký tên</h3>${saved?`<button class="pick" id="useSaved"><img src="${esc(saved)}" alt="" style="width:120px;height:56px;object-fit:contain"><span>Dùng chữ ký đã lưu</span></button>`:''}<canvas id="pad"></canvas><div class="colors"><button class="on" data-c="#111" style="background:#111" aria-label="Đen"></button><button data-c="#1340c8" style="background:#1340c8" aria-label="Xanh"></button><button data-c="#c81e1e" style="background:#c81e1e" aria-label="Đỏ"></button></div><div class="dbtn"><button class="btn" id="pClr">Xóa nét</button><button class="btn pri" id="pUse">Dùng chữ ký</button></div>`);
 const c=s.querySelector('#pad'),dpr=Math.min(2,devicePixelRatio||1);c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;const x=c.getContext('2d');x.lineCap=x.lineJoin='round';x.lineWidth=3.2*dpr;let col='#111',down=false,drawn=false,last=null;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
 c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;const p=pt(e);x.strokeStyle=col;x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p;drawn=true};c.onpointerup=()=>down=false;
 s.querySelector('.colors').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;col=b.dataset.c;s.querySelectorAll('.colors button').forEach(z=>z.classList.toggle('on',z===b))};
 s.querySelector('#pClr').onclick=()=>{x.clearRect(0,0,c.width,c.height);drawn=false};
 if(saved)s.querySelector('#useSaved').onclick=()=>{closeSheet();startPlace(saved)};
 s.querySelector('#pUse').onclick=()=>{if(!drawn)return toast('Hãy ký vào khung trước');const d=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++)if(d[(y*c.width+xx)*4+3]>10){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}
  const t=cv(x1-x0+12,y1-y0+12);t.getContext('2d').drawImage(c,x0-6,y0-6,t.width,t.height,0,0,t.width,t.height);const src=t.toDataURL('image/png');try{localStorage.setItem('scanpro-sig',src)}catch(e){}closeSheet();startPlace(src)}}
async function startPlace(src){const im=await sigImg(src),pg=$(`.pg[data-i="${idx}"]`),img=pg.querySelector('img'),ir=img.getBoundingClientRect(),pr=pg.getBoundingClientRect(),w=ir.width*.35,h=w*im.height/im.width;
 const el=document.createElement('div');el.className='sig';el.innerHTML=`<img src="${src}" alt=""><i></i>`;Object.assign(el.style,{left:(ir.left-pr.left+ir.width*.55)+'px',top:(ir.top-pr.top+ir.height*.78-h)+'px',width:w+'px',height:h+'px'});pg.appendChild(el);
 place={el,src,ar:im.height/im.width,pg,img};$('#placebar').hidden=false;$('#etools').hidden=true;$('#pager').style.overflowX='hidden';
 let mode=null,sx,sy,l0,t0,w0;el.onpointerdown=e=>{mode=e.target.tagName==='I'?'size':'move';sx=e.clientX;sy=e.clientY;l0=el.offsetLeft;t0=el.offsetTop;w0=el.offsetWidth;el.setPointerCapture(e.pointerId);e.stopPropagation()};
 el.onpointermove=e=>{if(!mode)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(mode==='move'){el.style.left=l0+dx+'px';el.style.top=t0+dy+'px'}else{const nw=Math.max(40,w0+dx);el.style.width=nw+'px';el.style.height=nw*place.ar+'px'}};el.onpointerup=()=>mode=null}
function endPlace(){if(place){place.el.remove();place=null}$('#placebar').hidden=true;$('#etools').hidden=false;$('#pager').style.overflowX=''}
$('#plNo').onclick=endPlace;
$('#plOk').onclick=async()=>{if(!place)return;const ir=place.img.getBoundingClientRect(),er=place.el.getBoundingClientRect(),p=cur.pages[idx];
 p.ov=(p.ov||[]).concat([{src:place.src,ar:place.ar,x:(er.left-ir.left)/ir.width,y:(er.top-ir.top)/ir.height,w:er.width/ir.width}]);endPlace();await busy('Đang chèn chữ ký…');await processPage(p);busy();refreshCur();toast('Đã ký vào trang '+(idx+1))};

/* ---------- export ---------- */
function exportSheet(d,o={}){const st={fmt:o.fmt||'pdf',size:S.size,q:o.q||S.quality};
 const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button data-v="${v}" class="${st[k]===v?'on':''}">${t}</button>`).join('')}</div>`;
 const s=openSheet(`<h3>Lưu tài liệu</h3><label class="fld"><span>Tên tệp</span><input class="inp" id="xName"></label>
 <div class="fld"><span>Định dạng</span>${seg('fmt',[['pdf','PDF'],['jpg','Ảnh JPG']])}</div>
 <div class="fld" id="xSizeF"><span>Khổ giấy</span>${seg('size',[['A4','A4'],['Letter','Letter'],['fit','Theo ảnh']])}</div>
 <div class="fld"><span>Chất lượng</span>${seg('q',[['high','Cao'],['med','Vừa'],['low','Nén nhỏ']])}</div>
 <label class="fld"><span>Chữ chìm (không bắt buộc)</span><input class="inp" id="xWm" placeholder="VD: BẢN SAO – CHỈ DÙNG NỘI BỘ" maxlength="60"></label>
 <button class="btn pri" id="xGo" style="width:100%">${ic('dl')}Lưu về máy</button><p class="note" id="xNote">${d.pages.length} trang</p>`);
 s.querySelector('#xName').value=d.name;if(o.wm)setTimeout(()=>s.querySelector('#xWm').focus(),60);
 const sync=()=>{s.querySelector('#xSizeF').hidden=st.fmt!=='pdf'};sync();
 s.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;st[g.dataset.k]=b.dataset.v;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));sync()});
 s.querySelector('#xGo').onclick=async()=>{const name=cleanName(s.querySelector('#xName').value),wm=s.querySelector('#xWm').value.trim();S.size=st.size;S.quality=st.q;saveS();closeSheet();await doExport(d,name,st,wm)}}
async function doExport(d,name,st,wm){const[max,qq]=QUAL[st.q];try{const pages=await loadPages(d),items=[];
 for(let i=0;i<pages.length;i++){await busy(`Đang tạo trang ${i+1}/${pages.length}…`);const im=await blobImg(pages[i].out),c=scaleTo(im,max);
  if(wm){const x=ctx(c),fs=Math.max(20,Math.min(c.width,c.height)/11);x.save();x.translate(c.width/2,c.height/2);x.rotate(-Math.atan2(c.height,c.width));x.font=`700 ${fs}px "Be Vietnam Pro",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(220,40,40,.16)';x.fillText(wm,0,0);x.restore()}
  const b=await toBlob(c,qq);items.push({bytes:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height})}
 let blob,fn;if(st.fmt==='pdf'){blob=buildPDF(items,st.size);fn=name+'.pdf'}else if(items.length===1){blob=new Blob([items[0].bytes],{type:'image/jpeg'});fn=name+'.jpg'}else{blob=buildZip(items.map((it,i)=>({name:`${name}_${String(i+1).padStart(2,'0')}.jpg`,bytes:it.bytes})));fn=name+'_anh.zip'}
 busy();toast(`Đã tạo ${fn} (${(blob.size/1048576).toFixed(2)} MB)`);await saveFile(fn,blob)}catch(e){busy();toast('Lỗi xuất tệp: '+e.message)}}

/* ---------- tools & doc picker ---------- */
function pickDoc(title,cb){if(!docs.length)return toast('Chưa có tài liệu – hãy quét trước');const L=docs.slice().sort((a,b)=>b.updated-a.updated);const s=openSheet(`<h3>${esc(title)}</h3>${L.map(d=>`<button class="pick" data-id="${esc(d.id)}"><img src="${esc(d.thumb||'')}" alt=""><span><b>${esc(d.name)}</b><br><small style="color:var(--mut)">${d.pages.length} trang · ${esc(fmtD(d.updated))}</small></span></button>`).join('')}`);s.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;closeSheet();cb(docs.find(d=>d.id===b.dataset.id))}}
const toolAct={scan:()=>startScan('new'),batch:()=>startScan('new',true),id:()=>{idShots=[];startScan('id')},imp:()=>startImport('new'),
 merge:()=>{show('home');sel=new Set();renderList();toast('Chọn từ 2 tài liệu trở lên để ghép')},
 sign:()=>pickDoc('Chọn tài liệu để ký',async d=>{await openDoc(d);signSheet()}),
 wm:()=>pickDoc('Thêm chữ chìm cho tài liệu',d=>exportSheet(d,{wm:true})),
 zip:()=>pickDoc('Nén tài liệu thành PDF nhỏ',d=>exportSheet(d,{q:'low'})),
 jpg:()=>pickDoc('Xuất tài liệu ra ảnh JPG',d=>exportSheet(d,{fmt:'jpg'})),
 filter:()=>pickDoc('Chọn tài liệu để làm trắng',async d=>{await openDoc(d);$('[data-e="filter"]').classList.add('on');openFilter()}),
 tools:()=>show('tools')};
$$('[data-t]').forEach(b=>b.onclick=()=>toolAct[b.dataset.t]());
$$('[data-q]').forEach(b=>b.onclick=()=>toolAct[b.dataset.q]());
$('#fabCam').onclick=()=>startScan('new');
$('#fabGal').onclick=()=>startImport('new');

/* ---------- settings ---------- */
$('#bSet').onclick=()=>{const tg=(k,t,sub)=>`<button class="tg" data-tg="${k}" style="width:100%;text-align:left"><span>${t}<small>${sub}</small></span><span class="sw ${S[k]?'on':''}"></span></button>`;
 const s=openSheet(`<h3>Cài đặt</h3>
 <div class="fld"><span>Bộ lọc mặc định khi quét</span><div class="seg" data-k="filter" style="flex-wrap:wrap">${FILTERS.map(([k,t])=>`<button data-v="${k}" class="${S.filter===k?'on':''}" style="flex:1 0 30%">${t}</button>`).join('')}</div></div>
 ${tg('autoCrop','Tự nhận viền giấy','Tự tìm 4 góc tài liệu sau khi chụp')}${tg('autoShot','Tự chụp khi giữ yên','Chỉ khi dùng camera trực tiếp')}
 <label class="fld" style="margin-top:8px"><span>Tên tệp bắt đầu bằng</span><input class="inp" id="sPre" maxlength="30"></label>
 <button class="mi dan" id="sWipe">${ic('trash')}Xóa toàn bộ tài liệu</button>
 <p class="note">Dữ liệu chỉ lưu trên máy này, trong trình duyệt. Để dùng như ứng dụng: mở trang bằng Chrome → menu ⋮ → “Thêm vào Màn hình chính”.</p>`);
 s.querySelector('#sPre').value=S.prefix;s.querySelector('#sPre').onchange=e=>{S.prefix=cleanName(e.target.value)||'Scan';saveS()};
 s.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;S.filter=b.dataset.v;saveS();s.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))};
 s.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg;S[k]=!S[k];saveS();b.querySelector('.sw').classList.toggle('on',S[k])});
 s.querySelector('#sWipe').onclick=async()=>{if(await confirmBox('Xóa toàn bộ?','Tất cả tài liệu đã quét sẽ bị xóa khỏi máy.')){for(const d of docs.slice())await deleteDoc(d);renderList();toast('Đã xóa toàn bộ')}}};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- install as app ---------- */
let instEv=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('#inst').hidden=false});
$('#instGo').onclick=async()=>{if(!instEv)return;instEv.prompt();try{const r=await instEv.userChoice;if(r.outcome==='accepted')toast('Đã cài Scan Pro')}catch(e){}instEv=null;$('#inst').hidden=true};
addEventListener('appinstalled',()=>{$('#inst').hidden=true});
try{if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.self===window.top)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

/* ---------- start ---------- */
(async()=>{await DB.open();docs=(await DB.all('docs'))||[];renderList()})();
window.__sp={detectQuad,warp,applyFilter,buildPDF,buildZip,onFiles,get docs(){return docs},get cur(){return cur}};
}
</script>
